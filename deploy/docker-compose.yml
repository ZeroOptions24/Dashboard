# MB-Dashboard auf dem eigenen Server (Strato): Datenbank, App, HTTPS.
# Start/Update: deploy/deploy.sh   ·   Geheimnisse: /opt/mb-dashboard/secrets.env (nie im Repository)
name: mb-dashboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mb
      POSTGRES_DB: mb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mb -d mb"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build:
      context: ..
      args:
        NEXT_PUBLIC_DATA_SOURCE: pipedrive
        NEXT_PUBLIC_EPP_URL: ${EPP_URL:-}
    restart: unless-stopped
    env_file: /opt/mb-dashboard/secrets.env
    environment:
      DATABASE_URL: postgresql://mb:${POSTGRES_PASSWORD}@db:5432/mb
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN fehlt}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
